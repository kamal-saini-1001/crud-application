<div class="container p-3">
    <h4 class="mb-2">
        Confirm Logout
    </h4>

    <p class="text-muted mb-3">
        Are you sure you want to log out of your account?
    </p>

    <div class="d-flex justify-content-end">
        <button matButton="tonal" class="me-2" (click)="cancel()">
            Cancel
        </button>

        <button matButton="filled" color="warn" (click)="logout()">
            Logout
        </button>
    </div>
</div>
