<div class="container d-flex justify-content-center align-items-center vh-100">

    <mat-card class="login-card shadow">

        <mat-card-header class="justify-content-center mb-3">
            <mat-card-title>Sign Up</mat-card-title>
        </mat-card-header>

        <mat-card-content>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Name</mat-label>
                <mat-icon matPrefix>person</mat-icon>
                <input matInput placeholder="Amit Kumar">
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Email</mat-label>
                <mat-icon matPrefix>person</mat-icon>
                <input matInput type="email" placeholder="example@gmail.com">
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Gennder</mat-label>
                <mat-icon matPrefix>male</mat-icon>
                <select matNativeControl required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Password</mat-label>
                <mat-icon matPrefix>lock</mat-icon>
                <input matInput type="password" placeholder="Enter password">
            </mat-form-field>

            <button matButton="filled" class="w-100 login-btn">
                Sign Up
            </button>

        </mat-card-content>

    </mat-card>

</div>
