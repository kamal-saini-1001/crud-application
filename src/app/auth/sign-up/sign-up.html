<div class="container d-flex justify-content-center align-items-center vh-100">

    <mat-card class="login-card shadow">

        <mat-card-header class="justify-content-center mb-3">
            <mat-card-title>Sign Up</mat-card-title>
        </mat-card-header>

        <mat-card-content>

            <form [formGroup]="signUpForm">
                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <mat-label>Name</mat-label>
                    <mat-icon matPrefix>person</mat-icon>
                    <input matInput placeholder="Amit Kumar" formControlName="name">
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <mat-label>Email</mat-label>
                    <mat-icon matPrefix>person</mat-icon>
                    <input matInput type="email" placeholder="example@gmail.com" formControlName="email">
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <mat-label>Gender</mat-label>
                    <mat-icon matPrefix>male</mat-icon>
                    <select matNativeControl required formControlName="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 mb-3">
                    <mat-label>Password</mat-label>
                    <mat-icon matPrefix>lock</mat-icon>
                    <input matInput type="password" placeholder="Enter password" formControlName="password">
                </mat-form-field>

                <button matButton="filled" class="w-100" (click)="signUp()">
                    Sign Up
                </button>
            </form>

            <p class="mt-5 text-center">
                Allready have an account? <a class="text-primary" style="cursor: pointer;" (click)="moveToLogin()">Login</a>
            </p>

        </mat-card-content>

    </mat-card>

</div>
